<!-- Micro-interaction for simulated completion -->
<script>
        // Simulate loading end for demonstration (optional interactivity)
        setTimeout(() => {
            console.log("RAAZ Feed: Still loading encrypted nodes...");
        }, 3000);

        // Vanilla interaction for tab switching simulation
        const navItems = document.querySelectorAll('nav button');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(i => {
                    i.classList.remove('text-primary', 'dark:text-primary-fixed-dim', 'bg-primary-container/20', 'rounded-xl', 'px-3', 'py-1');
                    i.classList.add('text-on-surface-variant', 'dark:text-outline-variant');
                    const icon = i.querySelector('.material-symbols-outlined');
                    if(icon) icon.style.fontVariationSettings = "'FILL' 0";
                });
                item.classList.add('text-primary', 'dark:text-primary-fixed-dim', 'bg-primary-container/20', 'rounded-xl', 'px-3', 'py-1');
                item.classList.remove('text-on-surface-variant', 'dark:text-outline-variant');
                const activeIcon = item.querySelector('.material-symbols-outlined');
                if(activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
