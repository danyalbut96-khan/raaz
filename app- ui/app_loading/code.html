<script>
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');
        const percentText = document.getElementById('percent-text');

        const messages = [
            "Establishing Secure Tunnel",
            "Encrypting Session Keys",
            "Verifying Identity Anonymity",
            "Syncing Distributed Ledger",
            "Checking Proxy Stability",
            "Authenticating Ghost Profile",
            "RAAZ Session Ready"
        ];

        let currentProgress = 0;
        let messageIndex = 0;

        function updateLoading() {
            // Random incremental progress
            const increment = Math.random() * 8 + 2;
            currentProgress = Math.min(currentProgress + increment, 100);
            
            progressBar.style.width = `${currentProgress}%`;
            percentText.innerText = `${Math.floor(currentProgress)}%`;

            // Message switching logic
            const targetMessageIndex = Math.floor((currentProgress / 100) * (messages.length - 1));
            
            if (targetMessageIndex !== messageIndex) {
                messageIndex = targetMessageIndex;
                
                // Animate message transition
                statusText.classList.remove('opacity-80', 'translate-y-0');
                statusText.classList.add('opacity-0', 'translate-y-2');
                
                setTimeout(() => {
                    statusText.innerText = messages[messageIndex];
                    statusText.classList.remove('opacity-0', 'translate-y-2');
                    statusText.classList.add('opacity-80', 'translate-y-0');
                }, 300);
            }

            if (currentProgress < 100) {
                const delay = Math.random() * 600 + 200;
                setTimeout(updateLoading, delay);
            } else {
                // Final completion state
                statusText.innerText = "Access Granted";
                statusText.classList.add('text-primary-container', 'font-bold');
                
                // Optional: Redirect or trigger next phase
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.8s ease';
                }, 1000);
            }
        }

        // Initialize status text animation
        setTimeout(() => {
            statusText.classList.add('opacity-80', 'translate-y-0');
            updateLoading();
        }, 500);

        // Micro-interaction: Subtle mouse glow following
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth * 100;
            const y = e.clientY / window.innerHeight * 100;
            document.body.style.background = `radial-gradient(circle at ${x}% ${y}%, #1e293b 0%, #0f172a 60%)`;
        });
    </script>
