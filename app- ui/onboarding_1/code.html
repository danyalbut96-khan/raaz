<script>
        // Micro-interaction for the "Next" button
        const nextBtn = document.querySelector('button.bg-primary');
        nextBtn.addEventListener('mouseenter', () => {
            const icon = nextBtn.querySelector('.material-symbols-outlined');
            icon.style.transform = 'translateX(4px)';
            icon.style.transition = 'transform 0.2s ease-out';
        });
        nextBtn.addEventListener('mouseleave', () => {
            const icon = nextBtn.querySelector('.material-symbols-outlined');
            icon.style.transform = 'translateX(0px)';
        });
    </script>
