<style>

<body class="text-on-surface">
<!-- Top App Bar (Shared Component Strategy) -->
<header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl flex items-center justify-between px-margin-mobile w-full h-16">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-200 transition-opacity hover:opacity-80 p-2">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md text-on-surface">Share a Secret</h1>
</div>
<button class="ripple bg-primary-container text-on-primary-container px-6 py-2 rounded-full font-label-lg text-label-lg shadow-sm hover:opacity-90 active:scale-95 duration-200" id="post-button">
            Post
        </button>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 pb-32 px-margin-mobile max-w-2xl mx-auto">
<!-- Input Section -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(17,24,39,0.04)] p-lg flex flex-col min-h-[400px]">
<!-- Anonymous ID Label -->
<div class="flex items-center gap-2 mb-lg opacity-60">
<span class="material-symbols-outlined text-body-md" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-label-lg text-label-lg">Posting anonymously</span>
</div>
<textarea class="w-full flex-grow bg-transparent border-none focus:ring-0 resize-none font-body-lg text-body-lg placeholder-outline-variant p-0 leading-relaxed" id="post-textarea" maxlength="500" placeholder="What's on your mind?"></textarea>
<div class="flex justify-end mt-md">
<span class="font-label-sm text-label-sm text-outline" id="char-counter">0 / 500</span>
</div>
</div>
<!-- Category Selection -->
<div class="mt-xl">
<h2 class="font-title-md text-title-md text-on-surface mb-md px-1">Select a Category</h2>
<div class="flex gap-sm overflow-x-auto hide-scrollbar pb-2">
<button class="category-chip whitespace-nowrap px-lg py-2.5 rounded-full border border-outline-variant font-label-lg text-label-lg bg-surface text-on-surface-variant hover:bg-surface-variant/20 transition-all duration-200" data-active="false">
                    Confessions
                </button>
<button class="category-chip whitespace-nowrap px-lg py-2.5 rounded-full border border-outline-variant font-label-lg text-label-lg bg-surface text-on-surface-variant hover:bg-surface-variant/20 transition-all duration-200" data-active="false">
                    Rants
                </button>
<button class="category-chip whitespace-nowrap px-lg py-2.5 rounded-full border border-outline-variant font-label-lg text-label-lg bg-surface text-on-surface-variant hover:bg-surface-variant/20 transition-all duration-200" data-active="false">
                    Questions
                </button>
<button class="category-chip whitespace-nowrap px-lg py-2.5 rounded-full border border-outline-variant font-label-lg text-label-lg bg-surface text-on-surface-variant hover:bg-surface-variant/20 transition-all duration-200" data-active="false">
                    Advice
                </button>
<button class="category-chip whitespace-nowrap px-lg py-2.5 rounded-full border border-outline-variant font-label-lg text-label-lg bg-surface text-on-surface-variant hover:bg-surface-variant/20 transition-all duration-200" data-active="false">
                    Random
                </button>
</div>

<!-- Security Visual -->
<div class="mt-2xl p-lg rounded-xl bg-surface-container-low flex items-center gap-lg">
<div class="p-md bg-secondary-container/10 rounded-full">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'opsz' 32;">verified_user</span>
</div>
<div>

<p class="font-body-md text-body-md text-on-surface-variant">Your identity is cryptographically hashed. Even we don't know who you are.</p>
</div>

<!-- Post Helper Bar (Mobile Focused) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/85 backdrop-blur-xl h-16 flex items-center px-margin-mobile justify-between md:hidden">
<div class="flex gap-md">
<button class="text-on-surface-variant p-2 hover:bg-surface-variant/20 rounded-full transition-colors">
<span class="material-symbols-outlined">image</span>
</button>
<button class="text-on-surface-variant p-2 hover:bg-surface-variant/20 rounded-full transition-colors">
<span class="material-symbols-outlined">alternate_email</span>
</button>
<button class="text-on-surface-variant p-2 hover:bg-surface-variant/20 rounded-full transition-colors">
<span class="material-symbols-outlined">mood</span>
</button>
</div>
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant border-t-primary-container rotate-0 transition-transform duration-300" id="progress-circle"></div>
</div>
</div>
<script>
        // Material Ripple Effect
        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
            circle.classList.add("ripple-effect");

            const ripple = button.getElementsByClassName("ripple-effect")[0];
            if (ripple) {
                ripple.remove();
            }

            button.appendChild(circle);
        }

        const postBtn = document.getElementById("post-button");
        postBtn.addEventListener("click", createRipple);

        // Character Counter & UI Feedback
        const textarea = document.getElementById("post-textarea");
        const counter = document.getElementById("char-counter");
        const progressCircle = document.getElementById("progress-circle");

        textarea.addEventListener("input", (e) => {
            const length = e.target.value.length;
            counter.innerText = `${length} / 500`;
            
            // Visual feedback on counter
            if (length > 450) {
                counter.classList.replace("text-outline", "text-error");
            } else {
                counter.classList.replace("text-error", "text-outline");
            }

            // Mobile progress indicator
            const percentage = (length / 500) * 360;
            progressCircle.style.transform = `rotate(${percentage}deg)`;
            if(length > 0) {
                progressCircle.classList.replace("border-outline-variant", "border-primary-container");
            } else {
                progressCircle.classList.replace("border-primary-container", "border-outline-variant");
            }
        });

        // Category Selection Logic
        const chips = document.querySelectorAll(".category-chip");
        chips.forEach(chip => {
            chip.addEventListener("click", () => {
                chips.forEach(c => {
                    c.classList.remove("bg-secondary-container", "text-on-secondary-container", "border-transparent");
                    c.classList.add("bg-surface", "text-on-surface-variant", "border-outline-variant");
                });
                chip.classList.remove("bg-surface", "text-on-surface-variant", "border-outline-variant");
                chip.classList.add("bg-secondary-container", "text-on-secondary-container", "border-transparent");
            });
        });

        // Focus behavior for textarea
        window.addEventListener('load', () => {
            textarea.focus();
        });
    </script>
