<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes subtle-pulse {
            0% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.95; }
        }
        
        @keyframes float-slow {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .animate-brand-pulse {
            animation: subtle-pulse 3s ease-in-out infinite;
        }

        .animate-float {
            animation: float-slow 6s ease-in-out infinite;
        }

        .splash-container {
            background-color: #F8FAFC;
        }

    body {

<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Splash Screen Wrapper -->
<main class="splash-container flex flex-col items-center justify-center min-h-screen relative px-margin-mobile md:px-margin-tablet">
<!-- Subtle Ambient Background Elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px] animate-float"></div>
<div class="absolute top-[60%] -right-[10%] w-[50%] h-[50%] bg-secondary/5 rounded-full blur-[150px] animate-float" style="animation-delay: -2s;"></div>
</div>
<!-- Center Identity -->
<div class="flex flex-col items-center z-10">
<!-- Logo Section -->
<div class="relative mb-lg">
<!-- Branding Glow -->
<div class="absolute inset-0 bg-primary/10 rounded-full blur-2xl animate-brand-pulse"></div>
<!-- Main Branding (RAAZ) -->
<div class="relative flex flex-col items-center">
<div class="mb-4">
<span class="material-symbols-outlined text-[64px] text-primary" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter animate-brand-pulse">
                        RAAZ
                    </h1>
</div>
</div>
<!-- Tagline Section -->
<div class="text-center opacity-0 translate-y-4 transition-all duration-1000 ease-out" id="tagline-container">
<p class="font-title-md text-title-md text-on-surface-variant font-medium tracking-wide">
                    Share Your Secrets. Stay Anonymous.
                </p>
</div>
<!-- Progress Indicator -->
<div class="mt-2xl w-48 h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-[3000ms] ease-in-out w-0" id="splash-progress"></div>
</div>
</div>
<!-- Security Badge Footer -->
<div class="absolute bottom-12 flex items-center gap-2 text-on-surface-variant/60">
<span class="material-symbols-outlined text-[18px]" data-icon="lock">lock</span>
<span class="font-label-sm text-label-sm uppercase tracking-[0.2em]">End-to-End Encrypted</span>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Animation triggers for splash elements
            const tagline = document.getElementById('tagline-container');
            const progress = document.getElementById('splash-progress');
            
            // Trigger entry animations
            setTimeout(() => {
                tagline.classList.remove('opacity-0', 'translate-y-4');
                tagline.classList.add('opacity-100', 'translate-y-0');
            }, 500);

            // Progress bar simulation
            setTimeout(() => {
                progress.style.width = '100%';
            }, 300);

            // Lightweight atmospheric interaction (Mouse parallax)
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                
                const backgroundElements = document.querySelectorAll('.bg-primary\\/5, .bg-secondary\\/5');
                backgroundElements.forEach((el, index) => {
                    const factor = index === 0 ? 1 : -1.5;
                    el.style.transform = `translate(${moveX * factor}px, ${moveY * factor}px)`;
                });
            });
        });
    </script>
