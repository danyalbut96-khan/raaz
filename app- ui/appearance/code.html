<body class="bg-background text-on-surface min-h-screen selection:bg-primary-container selection:text-on-primary-container">

<header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl transition-colors duration-300">
<div class="flex items-center justify-between px-4 h-16 w-full max-w-7xl mx-auto">

<button class="material-symbols-outlined p-2 rounded-full hover:bg-surface-container-high/50 transition-colors active:scale-95 text-primary" data-icon="arrow_back">arrow_back</button>

<!-- Mock Post Card -->
<div class="w-full max-w-sm rounded-2xl bg-white shadow-md border border-neutral-100 p-5 space-y-4 transition-all duration-500" id="mock-card">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">person_pin</span>
</div>
<div>
<div class="h-3 w-24 bg-neutral-200 rounded-full mb-2"></div>
<div class="h-2 w-16 bg-neutral-100 rounded-full"></div>
</div>
</div>
<div class="space-y-2">
<div class="h-4 w-full bg-neutral-100 rounded-md"></div>
<div class="h-4 w-5/6 bg-neutral-100 rounded-md"></div>
<div class="h-4 w-4/6 bg-neutral-100 rounded-md"></div>
</div>
<div class="pt-2 flex justify-between items-center">
<div class="flex gap-4">
<span class="material-symbols-outlined text-neutral-400 text-lg" data-icon="favorite">favorite</span>
<span class="material-symbols-outlined text-neutral-400 text-lg" data-icon="chat_bubble">chat_bubble</span>
</div>
<span class="material-symbols-outlined text-neutral-400 text-lg" data-icon="share">share</span>
</div>
</div>
<p class="mt-6 font-label-sm text-label-sm text-outline uppercase tracking-wider" id="preview-status">Light Theme Active</p>
</div>
</section>
<!-- Theme Selection List -->
<section class="space-y-2">
<h2 class="font-label-lg text-label-lg text-on-surface-variant px-2">CHOOSE THEME</h2>
<div class="space-y-1">
<!-- Light Theme -->
<label class="relative flex items-center p-4 rounded-2xl cursor-pointer hover:bg-surface-container-high/50 transition-all group active:scale-[0.98]">
<input checked="" class="peer sr-only" name="theme" onchange="updateTheme('light')" type="radio" value="light"/>
<div class="flex-1 flex items-center gap-4">
<div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined" data-icon="light_mode">light_mode</span>
</div>
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">Light Theme</span>
<span class="font-body-md text-body-md text-on-surface-variant">Clean and bright experience</span>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center peer-checked:border-primary transition-colors">
<div class="radio-dot w-3 h-3 rounded-full bg-primary scale-0"></div>
</div>
</label>
<!-- Dark Theme -->
<label class="relative flex items-center p-4 rounded-2xl cursor-pointer hover:bg-surface-container-high/50 transition-all group active:scale-[0.98]">
<input class="peer sr-only" name="theme" onchange="updateTheme('dark')" type="radio" value="dark"/>
<div class="flex-1 flex items-center gap-4">

</div>

</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline flex items-center justify-center peer-checked:border-primary transition-colors">
<div class="radio-dot w-3 h-3 rounded-full bg-primary scale-0"></div>
</div>
</label>

<label class="relative flex items-center p-4 rounded-2xl cursor-pointer hover:bg-surface-container-high/50 transition-all group active:scale-[0.98]">
<input class="peer sr-only" name="theme" onchange="updateTheme('system')" type="radio" value="system"/>
<div class="flex-1 flex items-center gap-4">

<span class="font-label-lg text-label-lg">Settings</span>
</a>

<script>
        function updateTheme(theme) {
            const previewContainer = document.getElementById('preview-container');
            const mockCard = document.getElementById('mock-card');
            const statusText = document.getElementById('preview-status');
            const root = document.documentElement;

            if (theme === 'dark') {
                root.classList.add('dark');
                previewContainer.classList.replace('bg-surface-container-lowest', 'bg-neutral-900');
                mockCard.classList.replace('bg-white', 'bg-neutral-800');
                mockCard.classList.replace('border-neutral-100', 'border-neutral-700');
                
                // Update internal card elements for dark preview
                mockCard.querySelectorAll('.bg-neutral-100').forEach(el => {
                    el.classList.replace('bg-neutral-100', 'bg-neutral-700');
                });
                mockCard.querySelectorAll('.bg-neutral-200').forEach(el => {
                    el.classList.replace('bg-neutral-200', 'bg-neutral-600');
                });
                
                statusText.innerText = "Dark Theme Active";
                statusText.classList.replace('text-outline', 'text-primary-fixed-dim');
            } else if (theme === 'light') {
                root.classList.remove('dark');
                previewContainer.classList.replace('bg-neutral-900', 'bg-surface-container-lowest');
                mockCard.classList.replace('bg-neutral-800', 'bg-white');
                mockCard.classList.replace('border-neutral-700', 'border-neutral-100');

                mockCard.querySelectorAll('.bg-neutral-700').forEach(el => {
                    el.classList.replace('bg-neutral-700', 'bg-neutral-100');
                });
                mockCard.querySelectorAll('.bg-neutral-600').forEach(el => {
                    el.classList.replace('bg-neutral-600', 'bg-neutral-200');
                });

                statusText.innerText = "Light Theme Active";
                statusText.classList.replace('text-primary-fixed-dim', 'text-outline');
            } else {
                // System Default Logic - for demo just toggle based on actual system preference
                const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                updateTheme(isSystemDark ? 'dark' : 'light');
                statusText.innerText = `System Default (${isSystemDark ? 'Dark' : 'Light'})`;
            }
        }

        // Initialize view based on current system/class
        window.onload = () => {
             // Syncing initial radio state
             if (document.documentElement.classList.contains('dark')) {
                 document.querySelector('input[value="dark"]').checked = true;
                 updateTheme('dark');
             }
        };
    </script>
